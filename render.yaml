services:
  - type: web
    name: invoice-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: AGENT_API_KEY
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: MAX_APPROVED_AMOUNT
        value: "1000"
      - key: ALLOWED_CURRENCIES
        value: USD,EUR,GBP,SGD
      - key: ACTION_API_URL
        sync: false
      - key: ACTION_API_KEY
        sync: false
